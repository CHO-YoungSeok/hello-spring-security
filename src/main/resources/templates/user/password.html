<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .brand-logo { font-size: 2rem; font-weight: 800; color: #e94560; letter-spacing: -1px; }
        .btn-primary-custom { background: #667eea; border-color: #667eea; color: #fff; }
        .btn-primary-custom:hover { background: #5a6fd6; border-color: #5a6fd6; color: #fff; }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233,69,96,.25); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-sm-8 col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="brand-logo">HanSung</div>
                        <p class="text-muted mt-1 mb-0">비밀번호 변경</p>
                    </div>

                    <form th:action="@{/user/password}" th:object="${passwordChangeDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">현재 비밀번호</label>
                            <input type="password" th:field="*{currentPassword}" class="form-control form-control-lg"
                                   placeholder="현재 비밀번호 입력" />
                            <div th:if="${#fields.hasErrors('currentPassword')}" class="text-danger small mt-1"
                                 th:errors="*{currentPassword}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">새 비밀번호</label>
                            <input type="password" th:field="*{newPassword}" class="form-control form-control-lg"
                                   placeholder="새 비밀번호 입력 (8자 이상)" />
                            <div th:if="${#fields.hasErrors('newPassword')}" class="text-danger small mt-1"
                                 th:errors="*{newPassword}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">새 비밀번호 확인</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control form-control-lg"
                                   placeholder="새 비밀번호 다시 입력" />
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1"
                                 th:errors="*{confirmPassword}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary-custom btn-lg w-100 fw-semibold">비밀번호 변경</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        <a th:href="@{/home}" class="text-decoration-none fw-semibold" style="color:#e94560">홈으로 돌아가기</a>
                    </p>
                    <p class="text-center text-muted small mt-4" th:text="${'실습 수행: ' + #temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss') + ' │ 학번: 2271439 │ 성명: 조영석'}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
